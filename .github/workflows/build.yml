name: Build VST3 (Windows)
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target PitCoreTune_VST3 --parallel

      - name: Run actions/upload-artifact@v4
        uses: actions/upload-artifact@v4
        with:
          name: PitCoreTune-VST3
          path: build/PitCoreTune_artifacts/Release/VST3/
